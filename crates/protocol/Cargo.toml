[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The game's messages: TCP stream reassembly, framing and protobuf decoding"

[dependencies]
thiserror.workspace = true
prost = "0.14"
prost-types = "0.14"
# Ordered stream map with O(1)-ish move-to-end, used for LRU eviction of idle
# TCP streams (mirrors the Python OrderedDict in packet_buffers.py).
indexmap = "2"

[build-dependencies]
# Pure-Rust protobuf compiler: no `protoc` binary needed. protox 0.9.x and
# prost-build 0.14.x both depend on prost-types ^0.14, which keeps the
# `FileDescriptorSet` type produced by protox compatible with the one
# `prost_build::Config::compile_fds` expects.
protox = "0.9"
prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
