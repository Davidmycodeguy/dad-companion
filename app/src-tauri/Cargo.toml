[package]
name = "dad-companion"
version = "1.0.0"
description = "Dark and Darker companion: market tools, item values, stash sorting"
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "dad_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
appdata = { path = "../../crates/appdata" }
game-data = { path = "../../crates/game-data" }
screen = { path = "../../crates/screen" }
tooltip = { path = "../../crates/tooltip" }
market = { path = "../../crates/market" }
state = { path = "../../crates/state" }
capture = { path = "../../crates/capture" }
protocol = { path = "../../crates/protocol" }
lister = { path = "../../crates/lister" }
input = { path = "../../crates/input" }
quests = { path = "../../crates/quests" }
sorter = { path = "../../crates/sorter" }
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
