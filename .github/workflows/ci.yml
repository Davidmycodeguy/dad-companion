# Runs the tests, lints and type checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Frontend types and tests
        working-directory: app
        run: |
          pnpm typecheck
          pnpm test

      # The app embeds the built frontend, so it has to exist before the Rust side compiles.
      - name: Build the frontend
        working-directory: app
        run: pnpm build

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
