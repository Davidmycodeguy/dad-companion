# Builds the Windows installer when a version tag (v1.0.0, v1.2.3, ...) is pushed, signs the update
# files, and drafts a GitHub release with them. Publishing the draft makes the app offer the update.
#
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY (the private key file's contents) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (its password).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # The app embeds the built frontend, so it has to exist before the Rust tests compile.
      - name: Build the frontend
        working-directory: app
        run: pnpm build

      - name: Test
        run: cargo test --workspace --release

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: DaD Companion ${{ github.ref_name }}
          releaseBody: Download the setup file below and run it. Installed copies update themselves.
          releaseDraft: true
          includeUpdaterJson: true
